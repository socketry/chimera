<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
		<title>Chimera Update</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			body {
				margin: 0;
				padding: 24px;
			}

			h1 {
				margin: 0 0 8px;
				font-size: 20px;
				font-weight: 650;
			}

			p {
				margin: 0 0 18px;
				color: color-mix(in srgb, CanvasText 72%, transparent);
				font-size: 13px;
			}

			progress {
				width: 100%;
				height: 14px;
			}

			progress[hidden],
			a[hidden] {
				display: none;
			}

			.status {
				margin-top: 10px;
				min-height: 18px;
				font-size: 12px;
				color: color-mix(in srgb, CanvasText 65%, transparent);
			}

			.actions {
				display: flex;
				gap: 8px;
				justify-content: flex-end;
				margin-top: 22px;
			}

			a {
				border: 0;
				border-radius: 6px;
				padding: 8px 14px;
				background: AccentColor;
				color: AccentColorText;
				font-size: 13px;
				text-decoration: none;
			}

			a.secondary {
				background: color-mix(in srgb, CanvasText 10%, transparent);
				color: CanvasText;
			}

			a[aria-disabled="true"] {
				pointer-events: none;
				opacity: 0.48;
				filter: grayscale(1);
			}
		</style>
	</head>
	<body>
		<h1>Update Available</h1>
		<p id="description">An update is available.</p>
		<progress id="progress" max="100" value="0" hidden></progress>
		<div id="status" class="status">Download the update now?</div>
		<div class="actions">
			<a id="later" class="secondary" href="chimera-update://later">Later</a>
			<a id="download" href="chimera-update://download">Download Update</a>
			<a id="restart" aria-disabled="true" hidden>Restart Now</a>
		</div>
		<script type="module" src="./update.js"></script>
	</body>
</html>
