<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Chimera Configuration</title>
		<script type="importmap">{{{importMapJson}}}</script>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #07111f;
				--panel: rgba(8, 14, 24, 0.84);
				--text: #eef6ff;
				--muted: #9fb0c8;
				--accent: #7dd3fc;
				--danger: #fca5a5;
				--success: #86efac;
				--border: rgba(148, 163, 184, 0.18);
				--control: rgba(5, 11, 21, 0.76);
			}

			@media (prefers-color-scheme: light) {
				:root {
					--bg: #eef3f8;
					--panel: rgba(255, 255, 255, 0.86);
					--text: #0f172a;
					--muted: #64748b;
					--accent: #0369a1;
					--danger: #b91c1c;
					--success: #047857;
					--border: rgba(15, 23, 42, 0.14);
					--control: rgba(255, 255, 255, 0.94);
				}
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				padding: 28px;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.45 "Avenir Next", "Helvetica Neue", sans-serif;
			}

			main {
				max-width: 960px;
				margin: 0 auto;
				display: grid;
				gap: 18px;
			}

			header,
			form {
				border: 1px solid var(--border);
				border-radius: 18px;
				background: var(--panel);
				box-shadow: 0 18px 60px rgba(0, 0, 0, 0.18);
				padding: 22px 24px;
			}

			header {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 18px;
				align-items: start;
			}

			.header-copy {
				display: grid;
				gap: 4px;
				min-width: 0;
			}

			.header-actions {
				display: flex;
				gap: 10px;
				align-items: center;
				justify-content: end;
				min-height: 40px;
			}

			h1,
			p {
				margin: 0;
			}

			h1 {
				font-size: clamp(28px, 5vw, 42px);
			}

			p {
				color: var(--muted);
			}

			code {
				font-family: "SFMono-Regular", Consolas, monospace;
				font-size: 13px;
			}

			fieldset {
				margin: 0 0 16px;
				padding: 16px;
				border: 1px solid var(--border);
				border-radius: 12px;
			}

			legend {
				padding: 0 8px;
				color: var(--accent);
				font-weight: 700;
			}

			label {
				display: grid;
				gap: 5px;
				color: var(--muted);
				font-size: 12px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.06em;
			}

			label.checkbox {
				display: flex;
				gap: 8px;
				align-items: center;
				min-height: 40px;
			}

			label.checkbox input {
				width: auto;
			}

			input,
			select,
			textarea {
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--control);
				color: var(--text);
				font: 14px/1.4 "Avenir Next", "Helvetica Neue", sans-serif;
			}

			input,
			select {
				width: 100%;
				padding: 9px 10px;
			}

			textarea {
				width: 100%;
				min-height: 260px;
				resize: vertical;
				padding: 14px;
				font: 13px/1.55 "SFMono-Regular", Consolas, monospace;
				tab-size: 2;
			}

			button {
				padding: 9px 13px;
				border: 1px solid color-mix(in srgb, var(--accent) 48%, var(--border));
				border-radius: 8px;
				background: color-mix(in srgb, var(--accent) 16%, var(--control));
				color: var(--text);
				font: inherit;
				cursor: pointer;
			}

			button:disabled {
				cursor: default;
				opacity: 0.52;
			}

			.save-button {
				min-width: 72px;
				transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
			}

			.save-button[data-dirty="true"] {
				background: color-mix(in srgb, var(--accent) 32%, var(--control));
				border-color: color-mix(in srgb, var(--accent) 72%, var(--border));
				box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 34%, transparent);
				animation: save-pulse 1800ms ease-in-out infinite;
				opacity: 1;
			}

			@keyframes save-pulse {
				50% {
					box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 10%, transparent);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.save-button[data-dirty="true"] {
					animation: none;
				}
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
			}

			details {
				margin-top: 16px;
			}

			summary {
				cursor: pointer;
				color: var(--accent);
				font-weight: 700;
			}

			.notice[data-kind="success"] {
				color: var(--success);
			}

			.notice[data-kind="error"] {
				color: var(--danger);
			}

			.notice[data-kind="dirty"] {
				color: var(--accent);
			}

			.notice {
				max-width: 280px;
				overflow: hidden;
				color: var(--muted);
				font-size: 13px;
				text-align: right;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			@media (max-width: 680px) {
				header {
					grid-template-columns: minmax(0, 1fr);
				}

				.header-actions {
					justify-content: start;
				}

				.grid {
					grid-template-columns: minmax(0, 1fr);
				}
			}
		</style>
	</head>
	<body>
		<main id="app"></main>
		<script id="initial-data" type="application/json">{{{initialDataJson}}}</script>
		<script type="module" src="/assets/chimera-configuration-editor.js"></script>
	</body>
</html>
